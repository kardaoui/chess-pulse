chesspulse:
  target: dev
  outputs:
    dev:
      type: postgres
      # Identifiants lus dans l'environnement, jamais écrits en dur :
      # ce fichier est versionné et le dépôt est public.
      # Les conteneurs Airflow reçoivent ces variables via env_file (.env.docker).
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      schema: public
      threads: 4
